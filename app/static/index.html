<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SDLC Skill Runner</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="mark">SDLC</span>
        <div>
          <h1>Kovan SDLC</h1>
        </div>
      </div>

      <nav id="stage-stepper" class="stage-stepper" aria-label="Workflow progress">
        <ol>
          <li data-stage="setup">Setup</li>
          <li data-stage="interview">Interview</li>
          <li data-stage="review">Review</li>
          <li data-stage="done">Done</li>
        </ol>
      </nav>

      <div class="header-controls">
        <label class="control">
          <span>Skill</span>
          <select id="skill-select"></select>
        </label>

        <div class="control project-control">
          <span>Project</span>
          <button type="button" id="project-toggle" class="select-like" aria-expanded="false">
            <span id="project-label">Select project</span>
          </button>
          <div id="project-menu" class="dropdown" hidden>
            <section class="picker-section">
              <h3>Git repositories</h3>
              <ul id="repo-list" class="picker-list"></ul>
            </section>
            <section class="picker-section">
              <h3>Folders</h3>
              <div class="dropdown-path">
                <button type="button" id="up-btn" class="ghost">Up</button>
                <code id="current-path"></code>
              </div>
              <ul id="folder-list" class="picker-list"></ul>
              <button type="button" id="select-dir-btn">Use this folder</button>
            </section>
            <form id="create-form" class="create-row">
              <input id="new-folder" type="text" placeholder="New folder name" required />
              <button type="submit">Create</button>
            </form>
          </div>
        </div>
      </div>
    </header>

    <p class="error banner health-meta" id="health-meta" hidden></p>

    <main class="chat-stage" id="chat-stage">
      <p class="error banner" id="setup-error" hidden></p>

      <details id="transcript-history" class="transcript-history" open>
        <summary id="transcript-summary">Interview history (0 messages)</summary>
        <div class="transcript-panel">
          <ol id="transcript" class="transcript"></ol>
        </div>
      </details>

      <p class="empty" id="empty-state">Select a skill and project above, then describe the business need to start the interview.</p>

      <aside class="brd-card" id="brd-card" hidden>
        <div class="brd-head">
          <h2>Business Requirements Document</h2>
          <p id="brd-status"></p>
        </div>
        <div class="brd-body">
          <div id="brd-preview" class="brd-preview"></div>
        </div>
        <div class="brd-actions-sticky" id="brd-actions">
          <div class="actions">
            <button type="button" id="approve-btn">Approve BRD</button>
            <button type="button" id="modify-btn" class="ghost">Modify BRD</button>
            <button type="button" id="more-btn" class="ghost">Add requirements</button>
          </div>
          <p class="path-note" id="save-path"></p>
        </div>
      </aside>

      <div id="mode-banner" class="mode-banner" hidden>
        <span id="mode-banner-text"></span>
        <button type="button" id="mode-cancel-btn" class="ghost">Cancel</button>
      </div>

      <form id="chat-form" class="composer">
        <input
          id="chat-input"
          type="text"
          placeholder="Type a message"
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
      <p class="error" id="chat-error" hidden></p>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
